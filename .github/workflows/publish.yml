name: Publish @nemtus/symbol-bootstrap

# Publishes the NEMTUS release of symbol-bootstrap to npm as @nemtus/symbol-bootstrap.
#
# Trigger: push of a `nemtus-vX.Y.Z` tag (X.Y.Z must equal package.json "version"). The `nemtus-`
# prefix keeps NEMTUS release tags apart from upstream's `vX.Y.Z` tags. Manual re-runs:
# workflow_dispatch on the tag ref. See docs/nemtus-fork.md ("Releasing").
#
#   ci       - the full CI workflow (fork invariants, lint, unit tests, e2e) on the tagged commit
#   pack     - builds the tarball once; every later job uses this exact artifact
#   publish  - npm publish via OIDC Trusted Publishing (no NPM_TOKEN) with provenance, gated by the
#              `npm-production` environment (required reviewers)
#   verify   - installs the published version from the registry with `npm install -g
#              @nemtus/symbol-bootstrap@X.Y.Z` and runs the same e2e (the `symbol-bootstrap` command
#              starts a local network)
#   release  - GitHub Release for the tag (the only job with contents: write; runs no repo code)

'on':
  push:
    tags:
      - 'nemtus-v*'
  workflow_dispatch: {}

permissions:
  contents: read

# One publish pipeline at a time; never cancel an in-flight publish.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24.x
  PACKAGE: '@nemtus/symbol-bootstrap'
  TAG_PREFIX: nemtus-v

jobs:
  check-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${REF_TYPE}" != 'tag' ]; then
            echo "::error::run this workflow on a ${TAG_PREFIX}X.Y.Z tag ref (got ${REF_TYPE} ${TAG})"; exit 1
          fi
          version="${TAG#"${TAG_PREFIX}"}"
          pkg_version="$(node -p 'require("./package.json").version')"
          pkg_name="$(node -p 'require("./package.json").name')"
          if [ "${version}" != "${pkg_version}" ] || [ "${pkg_name}" != "${PACKAGE}" ]; then
            echo "::error::tag ${TAG} does not match package.json (${pkg_name}@${pkg_version})"; exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      # NEMTUS and upstream version numbers diverge, so every release must be recorded in the version
      # map (docs/nemtus-fork.md) with the upstream release and images it actually contains.
      - name: Check the NEMTUS version map row for this release
        run: bash .github/scripts/check-version-map.sh --release

  ci:
    needs: check-tag
    uses: ./.github/workflows/ci.yml

  pack:
    needs: check-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm audit --omit=dev --audit-level=critical
      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - run: sfw npm ci
      - run: bash .github/scripts/pack.sh "${RUNNER_TEMP}/pack"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [check-tag, ci, pack]
    runs-on: ubuntu-latest
    # Manual approval gate: give the `npm-production` environment required reviewers, and name the
    # same environment in the npm Trusted Publisher config so only runs past this gate can publish.
    environment: npm-production
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC). No NPM_TOKEN.
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pack
      # Trusted Publishing needs npm >= 11.5.1. Assert the npm bundled with Node.js 24 rather than
      # `npm install -g npm@latest` (unpinned code in the id-token job).
      - run: |
          npm --version
          printf '11.5.1\n%s\n' "$(npm -v)" | sort -V -C \
            || { echo "::error::npm $(npm -v) < 11.5.1 (required for OIDC Trusted Publishing)"; exit 1; }
      # No checkout and no install here: the tarball built and tested above is published as-is.
      - env:
          VERSION: ${{ needs.check-tag.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "${PACKAGE}@${VERSION}" version >/dev/null 2>&1; then
            echo "${PACKAGE}@${VERSION} is already on npm; skipping publish (re-run)."
            exit 0
          fi
          npm publish "${RUNNER_TEMP}"/pack/*.tgz --access public --provenance

  verify:
    needs: [check-tag, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Wait for the registry to serve the new version
        env:
          VERSION: ${{ needs.check-tag.outputs.version }}
        run: |
          for _ in $(seq 1 30); do
            npm view "${PACKAGE}@${VERSION}" version && exit 0
            sleep 10
          done
          echo "::error::${PACKAGE}@${VERSION} not visible on the registry after 5 minutes"; exit 1
      - name: npm install -g from the registry + local network
        env:
          VERSION: ${{ needs.check-tag.outputs.version }}
          EXPECTED_VERSION: ${{ needs.check-tag.outputs.version }}
        run: bash .github/scripts/e2e.sh "${PACKAGE}@${VERSION}" "${RUNNER_TEMP}/verify"

  release:
    needs: [check-tag, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release for the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.check-tag.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "release ${TAG} already exists; nothing to do."
            exit 0
          fi
          prev="$(gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags" --paginate --jq '.[].ref' 2>/dev/null \
            | sed 's|^refs/tags/||' | grep -E "^${TAG_PREFIX}[0-9]" | grep -vxF "${TAG}" | sort -V | tail -n1 || true)"
          head="Published [\`${PACKAGE}\` ${VERSION}](https://www.npmjs.com/package/${PACKAGE}/v/${VERSION}) to npm via OIDC Trusted Publishing (provenance attached). See [NEMTUS-CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/NEMTUS-CHANGELOG.md)."
          if notes="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="${TAG}" ${prev:+-f previous_tag_name="${prev}"} -q '.body' 2>/dev/null)" && [ -n "${notes}" ]; then
            body="$(printf '%s\n\n%s\n' "${head}" "${notes}")"
          else
            body="${head}"
          fi
          gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --title "${PACKAGE} v${VERSION}" --notes "${body}"
